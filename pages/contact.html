<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Contact | Lutfor Rahman</title>

  <link rel="preconnect"
        href="https://fonts.googleapis.com">

  <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet"
        href="../css/contact.css">

</head>

<body>

<section class="contact-page">

  <div class="contact-header">

    <h1>Let's Work Together</h1>

    <p>
      Have a project in mind? Let's discuss your idea and
      build something amazing together.
    </p>

  </div>

  <div class="contact-container">

    <!-- Contact Info -->

    <div class="contact-info">

      <h2>Contact Information</h2>

      <div class="info-card">

        <i class="fa-solid fa-envelope"></i>

        <div>
          <h3>Email</h3>
          <p>lutforitsolution@gmail.com</p>
        </div>

      </div>

      <div class="info-card">

        <i class="fa-brands fa-whatsapp"></i>

        <div>
          <h3>WhatsApp</h3>
          <p>+8801908987817</p>
        </div>

      </div>

      <div class="info-card">

        <i class="fa-brands fa-linkedin"></i>

        <div>
          <h3>LinkedIn</h3>
          <p>linkedin.com/in/lutforitsolution</p>
        </div>

      </div>

      <div class="info-card">

        <i class="fa-brands fa-github"></i>

        <div>
          <h3>GitHub</h3>
          <p>github.com/rokeyaag</p>
        </div>

      </div>

      <div class="social-icons">

        <a href="https://github.com/rokeyaag"
           target="_blank">

          <i class="fa-brands fa-github"></i>

        </a>

        <a href="https://www.linkedin.com/in/lutforitsolution/"
           target="_blank">

          <i class="fa-brands fa-linkedin-in"></i>

        </a>

        <a href="mailto:lutforitsolution@gmail.com">

          <i class="fa-solid fa-envelope"></i>

        </a>

        <a href="https://wa.me/8801908987817"
           target="_blank">

          <i class="fa-brands fa-whatsapp"></i>

        </a>

      </div>

    </div>

    <!-- Form -->

    <div class="contact-form">

      <h2>Send Message</h2>

      <form>

        <input
          type="text"
          placeholder="Your Name"
          required
        >

        <input
          type="email"
          placeholder="Your Email"
          required
        >

        <input
          type="text"
          placeholder="Subject"
          required
        >

        <textarea
          rows="6"
          placeholder="Write your message..."
          required
        ></textarea>

        <button type="submit">

          <i class="fa-solid fa-paper-plane"></i>

          Send Message

        </button>

      </form>

    </div>

  </div>

  <div class="contact-btn">

    <a href="../index.html">

      <i class="fa-solid fa-arrow-left"></i>

      Back To Portfolio

    </a>

  </div>

</section>

</body>

</html>
