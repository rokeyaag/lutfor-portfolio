<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d19" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="80%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Blue Glow Gradient -->
    <radialGradient id="blueGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.38" />
      <stop offset="55%" stop-color="#06b6d4" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Cyan Accent Glow -->
    <radialGradient id="cyanGlow" cx="80%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Icon Gradient -->
    <linearGradient id="iconBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#93c5fd" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Card Shadow -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    
    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Futuristic Background -->
  <rect width="800" height="480" fill="url(#bgGrad)" />
  <rect width="800" height="480" fill="url(#blueGlow)" />
  <rect width="800" height="480" fill="url(#cyanGlow)" />

  <!-- Subtle Grid Lines -->
  <g stroke="#334155" stroke-width="1" stroke-opacity="0.25">
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="160" y1="0" x2="160" y2="480" />
    <line x1="320" y1="0" x2="320" y2="480" />
    <line x1="480" y1="0" x2="480" y2="480" />
    <line x1="640" y1="0" x2="640" y2="480" />
  </g>

  <!-- Central Glassmorphic App Badge Container -->
  <g transform="translate(400, 175)" filter="url(#cardShadow)">
    <!-- Outer Glow Ring -->
    <circle cx="0" cy="0" r="95" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="8, 6" />
    
    <!-- Squircle Icon Box -->
    <rect x="-70" y="-70" width="140" height="140" rx="36" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.9" />
    <rect x="-68" y="-68" width="136" height="136" rx="34" fill="#0f172a" fill-opacity="0.75" />

    <!-- School Building & AI Brain / Graduation Emblem -->
    <g transform="translate(0, -2) scale(1.15)" filter="url(#glowFilter)">
      <!-- School Roof Triangle / Temple Top -->
      <path d="M 0 -30 L 36 -10 L -36 -10 Z" fill="url(#iconBlueGrad)" stroke="#67e8f9" stroke-width="1.5" />
      <polygon points="0,-24 4,-14 -4,-14" fill="#ffffff" opacity="0.9" />
      
      <!-- Arch Pillars -->
      <rect x="-30" y="-8" width="10" height="28" rx="2" fill="url(#cyanGrad)" />
      <rect x="-12" y="-8" width="8" height="28" rx="2" fill="url(#iconBlueGrad)" />
      <rect x="4" y="-8" width="8" height="28" rx="2" fill="url(#iconBlueGrad)" />
      <rect x="20" y="-8" width="10" height="28" rx="2" fill="url(#cyanGrad)" />
      
      <!-- Foundation Steps -->
      <rect x="-36" y="20" width="72" height="6" rx="2" fill="url(#iconBlueGrad)" stroke="#67e8f9" stroke-width="1" />
      <rect x="-40" y="26" width="80" height="6" rx="2" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />

      <!-- Center AI Sparkle -->
      <circle cx="0" cy="4" r="3.5" fill="#facc15" />
      <path d="M 0 0 L 0 8 M -4 4 L 4 4" stroke="#ffffff" stroke-width="1" />
    </g>
  </g>

  <!-- Top Badge: AI-POWERED MULTI-TENANT SAAS -->
  <g transform="translate(400, 48)">
    <rect x="-165" y="-15" width="330" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.8" />
    <text x="0" y="5" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="11" fill="#38bdf8" letter-spacing="2" text-anchor="middle">🎓 AI-POWERED MULTI-TENANT SAAS</text>
  </g>

  <!-- Brand Title -->
  <g transform="translate(400, 310)">
    <text x="0" y="0" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="900" font-size="32" fill="url(#titleBlueGrad)" letter-spacing="3.5" text-anchor="middle" filter="url(#glowFilter)">SCHOOL MANAGEMENT AI</text>
  </g>

  <!-- Subtitle Tagline -->
  <g transform="translate(400, 345)">
    <text x="0" y="0" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="600" font-size="14" fill="#94a3b8" letter-spacing="1" text-anchor="middle">Smart Attendance, Exams, Accounting &amp; Groq AI Insights</text>
  </g>

  <!-- 4 Feature Pills on Bottom -->
  <g transform="translate(400, 410)">
    <!-- Pill 1 -->
    <g transform="translate(-255, 0)">
      <rect x="-70" y="-15" width="140" height="30" rx="15" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
      <text x="0" y="4" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="#38bdf8" text-anchor="middle">📊 Smart Dashboard</text>
    </g>
    
    <!-- Pill 2 -->
    <g transform="translate(-85, 0)">
      <rect x="-70" y="-15" width="140" height="30" rx="15" fill="#0f172a" stroke="#a855f7" stroke-width="1.2" />
      <text x="0" y="4" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="#c084fc" text-anchor="middle">🤖 Groq AI Insights</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(85, 0)">
      <rect x="-70" y="-15" width="140" height="30" rx="15" fill="#0f172a" stroke="#10b981" stroke-width="1.2" />
      <text x="0" y="4" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="#34d399" text-anchor="middle">💳 Fee &amp; Payroll</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(255, 0)">
      <rect x="-70" y="-15" width="140" height="30" rx="15" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2" />
      <text x="0" y="4" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="#fbbf24" text-anchor="middle">📖 Textbook AI</text>
    </g>
  </g>
</svg>