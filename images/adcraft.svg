<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="adcraftBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060814" />
      <stop offset="35%" stop-color="#0d1127" />
      <stop offset="70%" stop-color="#1e1035" />
      <stop offset="100%" stop-color="#070a16" />
    </linearGradient>

    <!-- Neon Glow Orbs -->
    <radialGradient id="indigoGlow" cx="20%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="pinkGlow" cx="80%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cyanGlow" cx="50%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- UI Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    
    <linearGradient id="accentBtnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="goldTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#a5b4fc" />
    </linearGradient>

    <!-- Card Shadow & Glow Filters -->
    <filter id="studioShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.8" />
    </filter>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Dark Canvas -->
  <rect width="800" height="480" fill="url(#adcraftBg)" />
  <rect width="800" height="480" fill="url(#indigoGlow)" />
  <rect width="800" height="480" fill="url(#pinkGlow)" />
  <rect width="800" height="480" fill="url(#cyanGlow)" />

  <!-- Subtle Perspective Grid -->
  <g opacity="0.12" stroke="#6366f1" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="100" y1="0" x2="100" y2="480" />
    <line x1="200" y1="0" x2="200" y2="480" />
    <line x1="300" y1="0" x2="300" y2="480" />
    <line x1="400" y1="0" x2="400" y2="480" />
    <line x1="500" y1="0" x2="500" y2="480" />
    <line x1="600" y1="0" x2="600" y2="480" />
    <line x1="700" y1="0" x2="700" y2="480" />
  </g>

  <!-- Top Header Title & Badge -->
  <g transform="translate(60, 45)">
    <!-- Brand Tag -->
    <rect x="0" y="0" width="145" height="28" rx="14" fill="#4f46e5" fill-opacity="0.25" stroke="#6366f1" stroke-width="1" />
    <circle cx="14" cy="14" r="4" fill="#10b981" />
    <text x="26" y="19" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#a5b4fc" letter-spacing="1">ADCRAFT STUDIO</text>

    <!-- Main Title -->
    <text x="0" y="62" font-family="'Inter', sans-serif" font-size="28" font-weight="900" fill="url(#goldTextGrad)" letter-spacing="-0.5">
      AI Graphic &amp; Social Ad Generator
    </text>
    <text x="0" y="86" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#94a3b8">
      Multi-Aspect Ratio Canvas • Gemini Copywriter • FLUX.1 Visuals
    </text>
  </g>

  <!-- Central Studio Stage Window -->
  <g transform="translate(60, 160)" filter="url(#studioShadow)">
    <!-- Outer Window Frame -->
    <rect width="680" height="260" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />

    <!-- Window Topbar -->
    <rect width="680" height="40" rx="16" fill="#0b0f19" fill-opacity="0.9" />
    <circle cx="24" cy="20" r="5" fill="#ef4444" opacity="0.8" />
    <circle cx="40" cy="20" r="5" fill="#f59e0b" opacity="0.8" />
    <circle cx="56" cy="20" r="5" fill="#10b981" opacity="0.8" />

    <!-- Aspect Ratio Toggle Pills -->
    <g transform="translate(230, 8)">
      <rect width="220" height="24" rx="6" fill="#1e293b" />
      <rect x="2" y="2" width="70" height="20" rx="4" fill="#6366f1" />
      <text x="37" y="16" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">1:1 Feed</text>
      <text x="110" y="16" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#94a3b8" text-anchor="middle">9:16 Story</text>
      <text x="180" y="16" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#94a3b8" text-anchor="middle">16:9 X/YT</text>
    </g>

    <!-- Export Action Button -->
    <rect x="575" y="8" width="90" height="24" rx="6" fill="url(#accentBtnGrad)" />
    <text x="620" y="24" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">EXPORT ⚡</text>

    <!-- Studio Canvas Area: Left Tools Panel -->
    <g transform="translate(16, 56)">
      <rect width="130" height="188" rx="8" fill="#0b0f19" fill-opacity="0.7" stroke="#1e293b" />
      
      <!-- AI Tool Items -->
      <g transform="translate(10, 14)">
        <rect width="110" height="28" rx="6" fill="#4f46e5" fill-opacity="0.2" stroke="#6366f1" stroke-width="1" />
        <text x="12" y="18" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#818cf8">✨ AI Copywriter</text>
      </g>
      <g transform="translate(10, 50)">
        <rect width="110" height="28" rx="6" fill="#ec4899" fill-opacity="0.15" stroke="#ec4899" stroke-width="0.8" />
        <text x="12" y="18" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#f472b6">🔮 FLUX Visuals</text>
      </g>
      <g transform="translate(10, 86)">
        <rect width="110" height="28" rx="6" fill="#1e293b" />
        <text x="12" y="18" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#cbd5e1">✂️ Smart Cutout</text>
      </g>
      <g transform="translate(10, 122)">
        <rect width="110" height="28" rx="6" fill="#1e293b" />
        <text x="12" y="18" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#cbd5e1">📐 Ad Templates</text>
      </g>
    </g>

    <!-- Studio Center: Live Interactive Ad Canvas -->
    <g transform="translate(160, 56)">
      <rect width="360" height="188" rx="8" fill="#030712" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4,4" />
      
      <!-- Ambient Ad Background -->
      <rect x="2" y="2" width="356" height="184" rx="6" fill="#0f172a" />
      <circle cx="180" cy="90" r="60" fill="#6366f1" fill-opacity="0.25" filter="url(#neonBlur)" />

      <!-- Ad Badge Layer -->
      <rect x="110" y="18" width="140" height="20" rx="10" fill="#4f46e5" />
      <text x="180" y="32" font-family="'Inter', sans-serif" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">⚡ 50% OFF FLASH SALE</text>

      <!-- Ad Headline Layer -->
      <text x="180" y="64" font-family="'Montserrat', sans-serif" font-size="15" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-0.3">
        THE NEXT-GEN REVOLUTION
      </text>

      <!-- Ad Subheadline -->
      <text x="180" y="82" font-family="'Inter', sans-serif" font-size="9" font-weight="500" fill="#94a3b8" text-anchor="middle">
        Engineered for high performance with unmatched elegance.
      </text>

      <!-- Product Hero Mock Frame -->
      <g transform="translate(130, 96)">
        <rect width="100" height="42" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="1" />
        <circle cx="30" cy="21" r="12" fill="#ec4899" fill-opacity="0.4" />
        <circle cx="70" cy="21" r="12" fill="#6366f1" fill-opacity="0.4" />
        <text x="50" y="25" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#e0e7ff" text-anchor="middle">🎧 HERO PRODUCT</text>
      </g>

      <!-- Ad CTA Button Layer -->
      <rect x="120" y="148" width="120" height="24" rx="12" fill="url(#accentBtnGrad)" />
      <text x="180" y="164" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">CLAIM OFFER →</text>
    </g>

    <!-- Studio Right: Layers & Styling Inspector -->
    <g transform="translate(534, 56)">
      <rect width="130" height="188" rx="8" fill="#0b0f19" fill-opacity="0.7" stroke="#1e293b" />
      <text x="12" y="20" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#a5b4fc">LAYERS (4)</text>
      
      <!-- Layer items -->
      <g transform="translate(8, 28)">
        <rect width="114" height="22" rx="4" fill="#6366f1" fill-opacity="0.25" stroke="#6366f1" stroke-width="0.8" />
        <text x="8" y="15" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#e0e7ff">T Headline (Selected)</text>
      </g>
      <g transform="translate(8, 56)">
        <rect width="114" height="22" rx="4" fill="#1e293b" />
        <text x="8" y="15" font-family="'Inter', sans-serif" font-size="9" font-weight="500" fill="#94a3b8">🏷️ Promo Badge</text>
      </g>
      <g transform="translate(8, 84)">
        <rect width="114" height="22" rx="4" fill="#1e293b" />
        <text x="8" y="15" font-family="'Inter', sans-serif" font-size="9" font-weight="500" fill="#94a3b8">🖼️ Product Cutout</text>
      </g>
      <g transform="translate(8, 112)">
        <rect width="114" height="22" rx="4" fill="#1e293b" />
        <text x="8" y="15" font-family="'Inter', sans-serif" font-size="9" font-weight="500" fill="#94a3b8">🔘 CTA Button</text>
      </g>

      <!-- Color swatches -->
      <g transform="translate(10, 150)">
        <text x="0" y="10" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#64748b">PALETTE</text>
        <circle cx="50" cy="7" r="6" fill="#6366f1" />
        <circle cx="68" cy="7" r="6" fill="#ec4899" />
        <circle cx="86" cy="7" r="6" fill="#10b981" />
        <circle cx="104" cy="7" r="6" fill="#f59e0b" />
      </g>
    </g>
  </g>
</svg>
