<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061314" />
      <stop offset="40%" stop-color="#0a2324" />
      <stop offset="80%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#021f1d" />
    </linearGradient>

    <!-- Emerald Radial Glow -->
    <radialGradient id="emeraldGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#061314" stop-opacity="0" />
    </radialGradient>

    <!-- Cyan Accent Glow -->
    <radialGradient id="cyanGlow" cx="80%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#061314" stop-opacity="0" />
    </radialGradient>

    <!-- Emerald Icon Gradient -->
    <linearGradient id="emeraldIconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldCoinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Title Emerald Gradient -->
    <linearGradient id="titleEmeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#6ee7b7" />
      <stop offset="70%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Card Shadow -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    
    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Cosmic Emerald Background -->
  <rect width="800" height="480" fill="url(#bgGrad)" />
  <rect width="800" height="480" fill="url(#emeraldGlow)" />
  <rect width="800" height="480" fill="url(#cyanGlow)" />

  <!-- Subtle Modern Finance Grid Lines -->
  <g stroke="#1e293b" stroke-width="1" stroke-opacity="0.35">
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="160" y1="0" x2="160" y2="480" />
    <line x1="320" y1="0" x2="320" y2="480" />
    <line x1="480" y1="0" x2="480" y2="480" />
    <line x1="640" y1="0" x2="640" y2="480" />
  </g>

  <!-- Central Glassmorphic App Badge Container -->
  <g transform="translate(400, 175)" filter="url(#cardShadow)">
    <!-- Outer Glow Ring -->
    <circle cx="0" cy="0" r="95" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="8, 6" />
    
    <!-- Squircle Icon Box -->
    <rect x="-70" y="-70" width="140" height="140" rx="36" fill="#042f2e" stroke="#10b981" stroke-width="3" stroke-opacity="0.9" />
    <rect x="-68" y="-68" width="136" height="136" rx="34" fill="#064e3b" fill-opacity="0.6" />

    <!-- Finance Wallet & Growing Trend Logo Icon -->
    <g transform="translate(0, -2) scale(1.05)" filter="url(#glowFilter)">
      <!-- Wallet Base -->
      <rect x="-38" y="-22" width="76" height="52" rx="12" fill="url(#emeraldIconGrad)" stroke="#ffffff" stroke-width="2" />
      
      <!-- Wallet Flap -->
      <path d="M -38 -22 L 38 -22 L 38 4 C 38 4 10 14 0 14 C -10 14 -38 4 -38 4 Z" fill="#047857" stroke="#ffffff" stroke-width="1.5" />

      <!-- Glowing Gold Coin on Wallet -->
      <circle cx="0" cy="18" r="14" fill="url(#goldCoinGrad)" stroke="#ffffff" stroke-width="1.5" />
      <text x="0" y="23" font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="14" fill="#78350f" text-anchor="middle">৳</text>

      <!-- Upward Trend Chart Arrow -->
      <path d="M -22 -32 L -4 -42 L 10 -36 L 32 -54" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 22 -54 L 32 -54 L 32 -44" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Top Badge: REACT NATIVE & EXPO APP -->
  <g transform="translate(400, 48)">
    <rect x="-145" y="-15" width="290" height="30" rx="15" fill="#042f2e" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.8" />
    <text x="0" y="5" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="11" fill="#34d399" letter-spacing="2" text-anchor="middle">📱 REACT NATIVE &amp; EXPO APP</text>
  </g>

  <!-- Brand Title -->
  <g transform="translate(400, 310)">
    <text x="0" y="0" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="900" font-size="33" fill="url(#titleEmeraldGrad)" letter-spacing="3" text-anchor="middle" filter="url(#glowFilter)">IMX DAILY EXPENSE</text>
  </g>

  <!-- Subtitle Tagline -->
  <g transform="translate(400, 345)">
    <text x="0" y="0" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="600" font-size="14" fill="#94a3b8" letter-spacing="1" text-anchor="middle">Smart AI-Powered Expense Tracking &amp; Budget Management</text>
  </g>

  <!-- 4 Feature Pills on Bottom -->
  <g transform="translate(400, 410)">
    <!-- Pill 1 -->
    <g transform="translate(-255, 0)">
      <rect x="-70" y="-15" width="140" height="30" rx="15" fill="#042f2e" stroke="#10b981" stroke-width="1.2" />
      <text x="0" y="4" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="#34d399" text-anchor="middle">💸 Daily Expense</text>
    </g>
    
    <!-- Pill 2 -->
    <g transform="translate(-85, 0)">
      <rect x="-70" y="-15" width="140" height="30" rx="15" fill="#042f2e" stroke="#06b6d4" stroke-width="1.2" />
      <text x="0" y="4" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="#22d3ee" text-anchor="middle">📊 Visual Charts</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(85, 0)">
      <rect x="-70" y="-15" width="140" height="30" rx="15" fill="#042f2e" stroke="#f59e0b" stroke-width="1.2" />
      <text x="0" y="4" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="#fbbf24" text-anchor="middle">🎯 Budget Goals</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(255, 0)">
      <rect x="-70" y="-15" width="140" height="30" rx="15" fill="#042f2e" stroke="#ec4899" stroke-width="1.2" />
      <text x="0" y="4" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="#f472b6" text-anchor="middle">⚡ Instant Export</text>
    </g>
  </g>
</svg>