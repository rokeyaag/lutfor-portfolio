<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="spBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="35%" stop-color="#0b112c" />
      <stop offset="70%" stop-color="#140b2e" />
      <stop offset="100%" stop-color="#050713" />
    </linearGradient>

    <!-- Neon Glow Orbs -->
    <radialGradient id="blueGlow" cx="25%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#1877f2" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="purpleGlow" cx="75%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cyanGlow" cx="50%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.96" />
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadowBox" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.75" />
    </filter>
    <filter id="glowG" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Canvas -->
  <rect width="800" height="480" fill="url(#spBg)" />
  <rect width="800" height="480" fill="url(#blueGlow)" />
  <rect width="800" height="480" fill="url(#purpleGlow)" />
  <rect width="800" height="480" fill="url(#cyanGlow)" />

  <!-- Perspective Grid -->
  <g opacity="0.1" stroke="#6366f1" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="160" y1="0" x2="160" y2="480" />
    <line x1="320" y1="0" x2="320" y2="480" />
    <line x1="480" y1="0" x2="480" y2="480" />
    <line x1="640" y1="0" x2="640" y2="480" />
  </g>

  <!-- Central Dashboard Mockup Card -->
  <g filter="url(#shadowBox)">
    <rect x="70" y="55" width="660" height="370" rx="20" fill="url(#cardBg)" stroke="rgba(99, 102, 241, 0.35)" stroke-width="1.5" />
  </g>

  <!-- Top Window Bar -->
  <rect x="70" y="55" width="660" height="42" rx="20" fill="#0f172a" opacity="0.9" />
  <rect x="70" y="75" width="660" height="22" fill="#0f172a" opacity="0.9" />
  <line x1="70" y1="97" x2="730" y2="97" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
  
  <!-- Window Controls -->
  <circle cx="98" cy="76" r="6" fill="#ef4444" />
  <circle cx="118" cy="76" r="6" fill="#f59e0b" />
  <circle cx="138" cy="76" r="6" fill="#10b981" />

  <!-- Platform Badge Top Right -->
  <rect x="520" y="68" width="180" height="20" rx="10" fill="rgba(99, 102, 241, 0.2)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1" />
  <text x="610" y="82" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#a5b4fc" text-anchor="middle">⚡ SOCIAL AUTOMATION SAAS</text>

  <!-- Left Hero Panel: Titles & Highlights -->
  <g transform="translate(105, 130)">
    <!-- Small Category Pill -->
    <rect x="0" y="0" width="145" height="24" rx="12" fill="rgba(59, 130, 246, 0.2)" stroke="#3b82f6" stroke-width="1" />
    <text x="72" y="16" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#60a5fa" text-anchor="middle">AI + SOCIAL ENG</text>

    <!-- Main Title -->
    <text x="0" y="60" font-family="'Inter', sans-serif" font-size="34" font-weight="800" fill="url(#titleGrad)" letter-spacing="-0.5">
      SocialPulse Hub
    </text>
    <text x="0" y="88" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#94a3b8">
      Automated Social Scheduling &amp; AI Photo Studio
    </text>

    <!-- Feature Badges -->
    <g transform="translate(0, 115)">
      <!-- Badge 1: Meta Graph API -->
      <rect x="0" y="0" width="135" height="30" rx="8" fill="rgba(24, 119, 242, 0.18)" stroke="rgba(24, 119, 242, 0.5)" stroke-width="1" />
      <text x="14" y="19" font-family="'Inter', sans-serif" font-size="14" fill="#1877f2">f</text>
      <text x="32" y="19" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#93c5fd">Meta Graph API</text>

      <!-- Badge 2: AI BG Removal -->
      <rect x="145" y="0" width="140" height="30" rx="8" fill="rgba(168, 85, 247, 0.18)" stroke="rgba(168, 85, 247, 0.5)" stroke-width="1" />
      <text x="157" y="19" font-family="'Inter', sans-serif" font-size="12" fill="#c084fc">✂️</text>
      <text x="177" y="19" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#e9d5ff">AI BG Remover</text>
    </g>

    <!-- Tech Stack Pills -->
    <g transform="translate(0, 160)">
      <rect x="0" y="0" width="75" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="37" y="15" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#cbd5e1" text-anchor="middle">FastAPI</text>

      <rect x="85" y="0" width="95" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="132" y="15" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#cbd5e1" text-anchor="middle">APScheduler</text>

      <rect x="190" y="0" width="60" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="220" y="15" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#cbd5e1" text-anchor="middle">u2net</text>

      <rect x="260" y="0" width="70" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="295" y="15" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#cbd5e1" text-anchor="middle">AES-256</text>
    </g>

    <!-- Live Status Indicator -->
    <g transform="translate(0, 205)">
      <circle cx="6" cy="6" r="5" fill="#10b981" filter="url(#glowG)" />
      <text x="18" y="10" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#34d399">Production Ready &bull; Auto Dispatcher Active</text>
    </g>
  </g>

  <!-- Right Visual Studio Mockup -->
  <g transform="translate(455, 125)">
    <!-- Photo Studio Card -->
    <rect x="0" y="0" width="240" height="260" rx="14" fill="#090d1a" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1.5" />
    
    <!-- Canvas Frame -->
    <rect x="15" y="15" width="210" height="150" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    
    <!-- Checkerboard pattern for transparent cut -->
    <g opacity="0.15">
      <rect x="15" y="15" width="210" height="150" fill="none" />
      <pattern id="checkers" width="16" height="16" patternUnits="userSpaceOnUse">
        <rect width="8" height="8" fill="#ffffff" />
        <rect x="8" y="8" width="8" height="8" fill="#ffffff" />
      </pattern>
      <rect x="15" y="15" width="210" height="150" fill="url(#checkers)" />
    </g>

    <!-- Gradient Backdrop Sample Inside Canvas -->
    <rect x="25" y="25" width="190" height="130" rx="6" fill="url(#accentGrad)" opacity="0.8" />
    
    <!-- Cutout Silhouette Shape -->
    <path d="M 120 70 Q 120 50, 130 50 Q 140 50, 140 70 L 145 95 Q 155 100, 155 125 L 105 125 Q 105 100, 115 95 Z" fill="#ffffff" opacity="0.95" />
    <circle cx="130" cy="55" r="12" fill="#ffffff" opacity="0.95" />

    <!-- Snap to Bottom / Fit Badge -->
    <rect x="65" y="132" width="110" height="18" rx="9" fill="rgba(0, 0, 0, 0.7)" stroke="#10b981" stroke-width="1" />
    <text x="120" y="145" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#10b981" text-anchor="middle">⬇️ Snap to Bottom</text>

    <!-- Social Publishing Flow Bar below Canvas -->
    <g transform="translate(15, 180)">
      <rect x="0" y="0" width="210" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="16" cy="16" r="10" fill="#1877f2" />
      <text x="16" y="20" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">f</text>
      <text x="32" y="20" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#f8fafc">Auto-Publish Feed</text>
      <rect x="145" y="7" width="55" height="18" rx="5" fill="#10b981" />
      <text x="172" y="20" font-family="'Inter', sans-serif" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle">SENT</text>
    </g>

    <g transform="translate(15, 220)">
      <rect x="0" y="0" width="210" height="28" rx="8" fill="rgba(99, 102, 241, 0.2)" stroke="rgba(99, 102, 241, 0.5)" stroke-width="1" />
      <text x="105" y="18" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#a5b4fc" text-anchor="middle">⏰ 15s Daemon Interval Engine</text>
    </g>
  </g>

  <!-- Glowing Corner Sparks -->
  <circle cx="85" cy="70" r="2" fill="#ffffff" />
  <circle cx="715" cy="410" r="2" fill="#38bdf8" />
</svg>
