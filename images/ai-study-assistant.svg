<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <!-- Deep Cosmic Obsidian Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070e" />
      <stop offset="35%" stop-color="#0b1120" />
      <stop offset="70%" stop-color="#140d21" />
      <stop offset="100%" stop-color="#060810" />
    </linearGradient>

    <!-- Vibrant Neon Radial Glows -->
    <radialGradient id="roseGlow" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.38" />
      <stop offset="50%" stop-color="#e11d48" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#05070e" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="amberGlow" cx="25%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#05070e" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purpleGlow" cx="75%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#05070e" stop-opacity="0" />
    </radialGradient>

    <!-- Official App Icon Outer Gradient -->
    <linearGradient id="appLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="30%" stop-color="#f97316" />
      <stop offset="70%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>

    <!-- Logo AI Text Gradient -->
    <linearGradient id="aiTextGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Chrome & Gold Metallic Title Gradient -->
    <linearGradient id="titleMetallicGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fef3c7" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="75%" stop-color="#fda4af" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Glassmorphic Border Gradients -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glow & Drop Shadow Filters -->
    <filter id="logoShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#f43f5e" flood-opacity="0.5" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="480" fill="url(#bgGrad)" />
  <rect width="800" height="480" fill="url(#roseGlow)" />
  <rect width="800" height="480" fill="url(#amberGlow)" />
  <rect width="800" height="480" fill="url(#purpleGlow)" />

  <!-- Futuristic Cyber Grid -->
  <g stroke="#334155" stroke-width="1" stroke-opacity="0.2">
    <line x1="0" y1="60" x2="800" y2="60" />
    <line x1="0" y1="120" x2="800" y2="120" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="0" y1="420" x2="800" y2="420" />

    <line x1="100" y1="0" x2="100" y2="480" />
    <line x1="200" y1="0" x2="200" y2="480" />
    <line x1="300" y1="0" x2="300" y2="480" />
    <line x1="400" y1="0" x2="400" y2="480" />
    <line x1="500" y1="0" x2="500" y2="480" />
    <line x1="600" y1="0" x2="600" y2="480" />
    <line x1="700" y1="0" x2="700" y2="480" />
  </g>

  <!-- Decorative Orbit Rings around Logo -->
  <g transform="translate(400, 168)">
    <circle cx="0" cy="0" r="105" fill="none" stroke="#f43f5e" stroke-width="1.8" stroke-opacity="0.5" stroke-dasharray="10, 8" />
    <circle cx="0" cy="0" r="88" fill="none" stroke="#fbbf24" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="6, 6" />

    <!-- Orbital Energy Nodes -->
    <circle cx="-105" cy="0" r="5" fill="#fbbf24" filter="url(#softGlow)" />
    <circle cx="105" cy="0" r="5" fill="#f43f5e" filter="url(#softGlow)" />
    <circle cx="0" cy="-105" r="5" fill="#38bdf8" filter="url(#softGlow)" />
    <circle cx="0" cy="105" r="5" fill="#a855f7" filter="url(#softGlow)" />
    <circle cx="74" cy="-74" r="3.5" fill="#fbbf24" opacity="0.8" />
    <circle cx="-74" cy="74" r="3.5" fill="#f43f5e" opacity="0.8" />
  </g>

  <!-- OFFICIAL AI STUDY ASSISTANT ICON EMBLEM (SQUIRCLE + MONOGRAM + SPARKS) -->
  <g transform="translate(400, 168)" filter="url(#logoShadow)">
    <rect x="-70" y="-70" width="140" height="140" rx="38" fill="url(#appLogoGrad)" />
    <rect x="-62" y="-62" width="124" height="124" rx="32" fill="#ffffff" />

    <!-- Glossy Highlight Accent -->
    <path d="M -60 -30 C -60 -52 -45 -60 -20 -60 L 20 -60 C 45 -60 60 -52 60 -30 C 60 -45 40 -52 0 -52 C -40 -52 -60 -45 -60 -30 Z" fill="#ffffff" opacity="0.4" />

    <!-- Official Bold 'AI' Monogram -->
    <text x="0" y="24" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-weight="900" font-size="62" fill="url(#aiTextGrad)" letter-spacing="-3" text-anchor="middle">AI</text>

    <!-- Glowing Tech Sparkle Stars -->
    <g transform="translate(42, -42) scale(0.85)">
      <path d="M 0 -16 Q 0 -2 14 -2 Q 0 -2 0 12 Q 0 -2 -14 -2 Q 0 -2 0 -16 Z" fill="#fbbf24" />
      <circle cx="0" cy="-2" r="3" fill="#ffffff" />
    </g>
    <g transform="translate(-40, 40) scale(0.6)">
      <path d="M 0 -14 Q 0 -2 12 -2 Q 0 -2 0 10 Q 0 -2 -12 -2 Q 0 -2 0 -14 Z" fill="#f43f5e" />
    </g>
  </g>

  <!-- TOP BADGE: DEVPOST HACKATHON 2026 -->
  <g transform="translate(400, 46)">
    <rect x="-165" y="-15" width="330" height="30" rx="15" fill="#0f172a" stroke="url(#borderGrad)" stroke-width="1.5" />
    <text x="-135" y="5" font-size="14">🏆</text>
    <text x="5" y="4" font-family="'Inter', sans-serif" font-weight="800" font-size="11.5" fill="#fef08a" letter-spacing="2" text-anchor="middle">DEVPOST AI HACKATHON 2026</text>
  </g>

  <!-- BRAND TITLE -->
  <g transform="translate(400, 308)">
    <text x="0" y="0" font-family="'Outfit', 'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="url(#titleMetallicGrad)" letter-spacing="2.5" text-anchor="middle" filter="url(#softGlow)">AI STUDY ASSISTANT</text>
  </g>

  <!-- SUBTITLE TAGLINE -->
  <g transform="translate(400, 342)">
    <text x="0" y="0" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" font-size="13.5" fill="#cbd5e1" letter-spacing="0.5" text-anchor="middle">Socratic AI Tutor • Gemini 1.5 Flash Vision OCR • Gamified Learning</text>
  </g>

  <!-- 4 PROFESSIONAL TECH PILLS AT BOTTOM -->
  <g transform="translate(400, 412)">
    <g transform="translate(-255, 0)">
      <rect x="-72" y="-16" width="144" height="32" rx="16" fill="#0f172a" stroke="#a855f7" stroke-width="1.4" />
      <text x="0" y="5" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#c084fc" text-anchor="middle">⚡ Gemini 1.5 Flash</text>
    </g>
    
    <g transform="translate(-85, 0)">
      <rect x="-72" y="-16" width="144" height="32" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1.4" />
      <text x="0" y="5" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#38bdf8" text-anchor="middle">📷 Vision OCR Solver</text>
    </g>

    <g transform="translate(85, 0)">
      <rect x="-72" y="-16" width="144" height="32" rx="16" fill="#0f172a" stroke="#f59e0b" stroke-width="1.4" />
      <text x="0" y="5" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#fbbf24" text-anchor="middle">🎯 MCQ Quiz Arena</text>
    </g>

    <g transform="translate(255, 0)">
      <rect x="-72" y="-16" width="144" height="32" rx="16" fill="#0f172a" stroke="#f43f5e" stroke-width="1.4" />
      <text x="0" y="5" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#fb7185" text-anchor="middle">🪙 Points-to-Pro Tier</text>
    </g>
  </g>
</svg>
