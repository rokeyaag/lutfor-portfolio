<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16" />
      <stop offset="50%" stop-color="#0d1424" />
      <stop offset="100%" stop-color="#151028" />
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="100%" stop-color="#00bbf9" />
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8338ec" />
      <stop offset="100%" stop-color="#3a86ff" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bgGrad)" />

  <!-- Cyber Grid Pattern -->
  <g opacity="0.08" stroke="#00f5d4" stroke-width="1">
    <line x1="0" y1="60" x2="800" y2="60" />
    <line x1="0" y1="120" x2="800" y2="120" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="0" y1="420" x2="800" y2="420" />

    <line x1="80" y1="0" x2="80" y2="480" />
    <line x1="160" y1="0" x2="160" y2="480" />
    <line x1="240" y1="0" x2="240" y2="480" />
    <line x1="320" y1="0" x2="320" y2="480" />
    <line x1="400" y1="0" x2="400" y2="480" />
    <line x1="480" y1="0" x2="480" y2="480" />
    <line x1="560" y1="0" x2="560" y2="480" />
    <line x1="640" y1="0" x2="640" y2="480" />
    <line x1="720" y1="0" x2="720" y2="480" />
  </g>

  <!-- Central Shield Glow Circle -->
  <circle cx="140" cy="140" r="90" fill="#00f5d4" opacity="0.05" filter="url(#glow)" />
  <circle cx="660" cy="340" r="110" fill="#8338ec" opacity="0.07" filter="url(#glow)" />

  <!-- Shield & Monitor Emblem -->
  <g transform="translate(80, 70)">
    <path d="M60 10 L110 32 C110 85 85 125 60 140 C35 125 10 85 10 32 Z" 
          fill="none" stroke="url(#cyanGlow)" stroke-width="4" filter="url(#softGlow)" />
    <path d="M60 22 L98 40 C98 80 78 112 60 125 C42 112 22 80 22 40 Z" 
          fill="#0b1626" opacity="0.85" />
    
    <rect x="36" y="46" width="48" height="34" rx="4" fill="none" stroke="#00f5d4" stroke-width="2.5" />
    <line x1="60" y1="80" x2="60" y2="92" stroke="#00f5d4" stroke-width="2.5" />
    <line x1="48" y1="92" x2="72" y2="92" stroke="#00f5d4" stroke-width="2.5" />
    <path d="M42 63 L49 63 L53 54 L58 72 L63 60 L67 65 L78 65" fill="none" stroke="#ff007f" stroke-width="2" />
  </g>

  <!-- Header Title -->
  <text x="215" y="110" font-family="'Segoe UI', Inter, sans-serif" font-size="32" font-weight="800" fill="#ffffff" letter-spacing="1.5">
    PARENTAL SCREEN TRACKER
  </text>
  <text x="215" y="145" font-family="'Segoe UI', Inter, sans-serif" font-size="14" font-weight="600" fill="#00f5d4" letter-spacing="3">
    CROSS-PLATFORM ACTIVITY &amp; SCREEN TIME MONITOR
  </text>

  <!-- Tag Pills -->
  <g transform="translate(215, 165)">
    <rect x="0" y="0" width="125" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="14" cy="14" r="4" fill="#10b981" />
    <text x="26" y="18" font-family="sans-serif" font-size="11" font-weight="700" fill="#e2e8f0">WINDOWS CLIENT</text>

    <rect x="135" y="0" width="120" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="149" cy="14" r="4" fill="#38bdf8" />
    <text x="161" y="18" font-family="sans-serif" font-size="11" font-weight="700" fill="#e2e8f0">FASTAPI &amp; PG 16</text>

    <rect x="265" y="0" width="135" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="279" cy="14" r="4" fill="#a855f7" />
    <text x="291" y="18" font-family="sans-serif" font-size="11" font-weight="700" fill="#e2e8f0">OFFLINE SQLITE SYNC</text>

    <rect x="410" y="0" width="130" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="424" cy="14" r="4" fill="#ec4899" />
    <text x="436" y="18" font-family="sans-serif" font-size="11" font-weight="700" fill="#e2e8f0">REACT NATIVE APP</text>
  </g>

  <!-- Interactive Mock Dashboard Card Container -->
  <g transform="translate(80, 220)">
    <rect x="0" y="0" width="640" height="215" rx="14" fill="#0c1322" stroke="#1e2d4a" stroke-width="1.5" />

    <rect x="0" y="0" width="640" height="38" rx="14" fill="#111c30" />
    <circle cx="20" cy="19" r="5" fill="#ef4444" />
    <circle cx="36" cy="19" r="5" fill="#eab308" />
    <circle cx="52" cy="19" r="5" fill="#22c55e" />
    <text x="75" y="23" font-family="monospace" font-size="12" fill="#94a3b8">Live Child Monitoring Console • Device: Laptop-Children (Online)</text>

    <!-- Metric 1: Today Screen Time -->
    <g transform="translate(25, 55)">
      <rect width="175" height="65" rx="8" fill="#152035" stroke="#1e2f4f" stroke-width="1" />
      <text x="16" y="24" font-family="sans-serif" font-size="11" fill="#94a3b8">TOTAL USAGE TODAY</text>
      <text x="16" y="50" font-family="sans-serif" font-size="20" font-weight="800" fill="#00f5d4">2h 45m</text>
      <text x="105" y="50" font-family="sans-serif" font-size="11" fill="#10b981">/ 4h Quota</text>
    </g>

    <!-- Metric 2: Enforcer Status -->
    <g transform="translate(225, 55)">
      <rect width="185" height="65" rx="8" fill="#152035" stroke="#1e2f4f" stroke-width="1" />
      <text x="16" y="24" font-family="sans-serif" font-size="11" fill="#94a3b8">ENFORCER &amp; LIMITS</text>
      <text x="16" y="50" font-family="sans-serif" font-size="18" font-weight="800" fill="#38bdf8">22 Rules Active</text>
    </g>

    <!-- Metric 3: Active App -->
    <g transform="translate(435, 55)">
      <rect width="180" height="65" rx="8" fill="#152035" stroke="#1e2f4f" stroke-width="1" />
      <text x="16" y="24" font-family="sans-serif" font-size="11" fill="#94a3b8">FOREGROUND APP</text>
      <text x="16" y="50" font-family="sans-serif" font-size="16" font-weight="800" fill="#f43f5e">Roblox (Game)</text>
    </g>

    <!-- Activity Bar Visualizer -->
    <g transform="translate(25, 140)">
      <text x="0" y="16" font-family="sans-serif" font-size="12" font-weight="700" fill="#cbd5e1">Weekly Screen Time Distribution &amp; Limits</text>
      
      <g transform="translate(0, 26)">
        <rect x="0" width="210" height="16" rx="4" fill="#38bdf8" />
        <rect x="215" width="130" height="16" rx="4" fill="#818cf8" />
        <rect x="350" width="140" height="16" rx="4" fill="#f43f5e" />
        <rect x="495" width="95" height="16" rx="4" fill="#10b981" />
      </g>

      <g transform="translate(0, 56)">
        <circle cx="6" cy="-4" r="4" fill="#38bdf8" />
        <text x="16" y="0" font-family="sans-serif" font-size="11" fill="#94a3b8">Education (36%)</text>

        <circle cx="160" cy="-4" r="4" fill="#818cf8" />
        <text x="170" y="0" font-family="sans-serif" font-size="11" fill="#94a3b8">Browsing (22%)</text>

        <circle cx="310" cy="-4" r="4" fill="#f43f5e" />
        <text x="320" y="0" font-family="sans-serif" font-size="11" fill="#94a3b8">Gaming Limit (24%)</text>

        <circle cx="480" cy="-4" r="4" fill="#10b981" />
        <text x="490" y="0" font-family="sans-serif" font-size="11" fill="#94a3b8">Social/Other (18%)</text>
      </g>
    </g>
  </g>
</svg>