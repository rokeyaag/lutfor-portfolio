<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <!-- Gradients -->
    <linearGradient id="neuralBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="45%" stop-color="#0a122c" />
      <stop offset="85%" stop-color="#061f3d" />
      <stop offset="100%" stop-color="#02040a" />
    </linearGradient>

    <radialGradient id="cyanCenterGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.38" />
      <stop offset="50%" stop-color="#4facfe" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#050814" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5a0" />
      <stop offset="100%" stop-color="#00d9f5" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#neuralBg)" />
  <rect width="800" height="480" fill="url(#cyanCenterGlow)" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.12" stroke="#00f2fe" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="160" y1="0" x2="160" y2="480" />
    <line x1="320" y1="0" x2="320" y2="480" />
    <line x1="480" y1="0" x2="480" y2="480" />
    <line x1="640" y1="0" x2="640" y2="480" />
  </g>

  <!-- Neural Network Synapse Lines -->
  <g stroke="#00f2fe" stroke-width="1.8" opacity="0.45">
    <line x1="200" y1="180" x2="320" y2="140" />
    <line x1="200" y1="180" x2="310" y2="230" />
    <line x1="320" y1="140" x2="480" y2="140" />
    <line x1="310" y1="230" x2="490" y2="230" />
    <line x1="480" y1="140" x2="600" y2="180" />
    <line x1="490" y1="230" x2="600" y2="180" />
    <line x1="320" y1="140" x2="490" y2="230" />
    <line x1="310" y1="230" x2="480" y2="140" />
    <line x1="400" y1="90" x2="320" y2="140" />
    <line x1="400" y1="90" x2="480" y2="140" />
  </g>

  <!-- Neural Synapse Nodes -->
  <circle cx="200" cy="180" r="7" fill="#00f5a0" filter="url(#glow)" />
  <circle cx="320" cy="140" r="9" fill="#00f2fe" filter="url(#glow)" />
  <circle cx="310" cy="230" r="8" fill="#4facfe" filter="url(#glow)" />
  <circle cx="480" cy="140" r="9" fill="#00f2fe" filter="url(#glow)" />
  <circle cx="490" cy="230" r="8" fill="#4facfe" filter="url(#glow)" />
  <circle cx="600" cy="180" r="7" fill="#00f5a0" filter="url(#glow)" />
  <circle cx="400" cy="90" r="10" fill="#00f2fe" filter="url(#glow)" />

  <!-- Center Glowing Brain / Core Hexagon Frame -->
  <polygon points="400,110 465,148 465,222 400,260 335,222 335,148" fill="#0c1a3b" stroke="#00f2fe" stroke-width="2.5" opacity="0.9" filter="url(#glow)" />
  
  <!-- Sound Wave Equalizer inside Hexagon -->
  <g fill="#00f5a0" filter="url(#glow)">
    <rect x="365" y="172" width="6" height="26" rx="3" />
    <rect x="377" y="160" width="6" height="50" rx="3" />
    <rect x="389" y="150" width="6" height="70" rx="3" />
    <rect x="401" y="156" width="6" height="58" rx="3" />
    <rect x="413" y="166" width="6" height="38" rx="3" />
    <rect x="425" y="176" width="6" height="18" rx="3" />
  </g>

  <!-- Title Badge -->
  <rect x="250" y="295" width="300" height="32" rx="16" fill="rgba(0,242,254,0.12)" stroke="#00f2fe" stroke-width="1.2" />
  <text x="400" y="316" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#00f2fe" text-anchor="middle" letter-spacing="2">DEEP LEARNING NLP &amp; VOICE AI</text>

  <!-- Main Title -->
  <text x="400" y="375" font-family="'Inter', sans-serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">Neural Chat Bot</text>
  
  <!-- Subtitle -->
  <text x="400" y="415" font-family="'Inter', sans-serif" font-size="16" font-weight="500" fill="#94a3b8" text-anchor="middle">Real-time Bilingual Voice &amp; Talking Lip-Sync Avatar</text>

  <!-- Tags Pill -->
  <g font-family="'Inter', sans-serif" font-size="12" font-weight="600">
    <rect x="230" y="432" width="90" height="24" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="275" y="448" fill="#38bdf8" text-anchor="middle">PyTorch 2.x</text>

    <rect x="330" y="432" width="135" height="24" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="397" y="448" fill="#4ade80" text-anchor="middle">Web Speech API</text>

    <rect x="475" y="432" width="95" height="24" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="522" y="448" fill="#f43f5e" text-anchor="middle">Bengali &amp; En</text>
  </g>
</svg>
