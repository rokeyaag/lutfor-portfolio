<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0a1f" />
      <stop offset="40%" stop-color="#18113c" />
      <stop offset="80%" stop-color="#4c1d95" />
      <stop offset="100%" stop-color="#0c0a1f" />
    </linearGradient>

    <!-- Fuchsia Radial Glow -->
    <radialGradient id="fuchsiaGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0c0a1f" stop-opacity="0" />
    </radialGradient>

    <!-- Orange Glow -->
    <radialGradient id="orangeGlow" cx="80%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0c0a1f" stop-opacity="0" />
    </radialGradient>

    <!-- Cart Gradient -->
    <linearGradient id="cartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#f0abfc" />
      <stop offset="70%" stop-color="#e879f9" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Card Shadow -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    
    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Cosmic Indigo Background -->
  <rect width="800" height="480" fill="url(#bgGrad)" />
  <rect width="800" height="480" fill="url(#fuchsiaGlow)" />
  <rect width="800" height="480" fill="url(#orangeGlow)" />

  <!-- Modern Subtle Grid Lines -->
  <g stroke="#334155" stroke-width="1" stroke-opacity="0.25">
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="160" y1="0" x2="160" y2="480" />
    <line x1="320" y1="0" x2="320" y2="480" />
    <line x1="480" y1="0" x2="480" y2="480" />
    <line x1="640" y1="0" x2="640" y2="480" />
  </g>

  <!-- Central Glassmorphic App Badge Container with Shopping Cart Logo -->
  <g transform="translate(400, 175)" filter="url(#cardShadow)">
    <!-- Outer Glow Ring -->
    <circle cx="0" cy="0" r="96" fill="none" stroke="#d946ef" stroke-width="2.5" stroke-opacity="0.45" stroke-dasharray="8, 6" />
    
    <!-- Squircle Icon Box -->
    <rect x="-70" y="-70" width="140" height="140" rx="36" fill="#1e1b4b" stroke="#d946ef" stroke-width="3" stroke-opacity="0.9" />
    <rect x="-68" y="-68" width="136" height="136" rx="34" fill="#2e1065" fill-opacity="0.6" />

    <!-- Modern Shopping Cart & Product Bag Icon -->
    <g transform="translate(0, 0) scale(1.15)" filter="url(#glowFilter)">
      <!-- Shopping Bag -->
      <path d="M -22 -10 L 22 -10 L 26 26 C 26 30 22 34 18 34 L -18 34 C -22 34 -26 30 -26 26 Z" fill="url(#cartGrad)" stroke="#ffffff" stroke-width="1.8" />
      <!-- Bag Handle -->
      <path d="M -12 -10 C -12 -24 12 -24 12 -10" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
      <!-- Glowing Star / Sparkle on Bag -->
      <path d="M 0 4 Q 0 14 8 14 Q 0 14 0 24 Q 0 14 -8 14 Q 0 14 0 4 Z" fill="#ffffff" />
    </g>
  </g>

  <!-- Top Badge: FULL STACK REACT & DJANGO -->
  <g transform="translate(400, 48)">
    <rect x="-155" y="-15" width="310" height="30" rx="15" fill="#1e1b4b" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.8" />
    <text x="0" y="5" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="11" fill="#c084fc" letter-spacing="2" text-anchor="middle">🛍️ FULL STACK REACT &amp; DJANGO</text>
  </g>

  <!-- Brand Title -->
  <g transform="translate(400, 310)">
    <text x="0" y="0" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="900" font-size="33" fill="url(#titleGrad)" letter-spacing="3" text-anchor="middle" filter="url(#glowFilter)">E-COMMERCE PLATFORM</text>
  </g>

  <!-- Subtitle Tagline -->
  <g transform="translate(400, 345)">
    <text x="0" y="0" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="600" font-size="14" fill="#94a3b8" letter-spacing="1" text-anchor="middle">Multi-Vendor Store, Product Catalog &amp; Secure Order Management</text>
  </g>

  <!-- 4 Feature Pills on Bottom -->
  <g transform="translate(400, 410)">
    <!-- Pill 1 -->
    <g transform="translate(-255, 0)">
      <rect x="-70" y="-15" width="140" height="30" rx="15" fill="#1e1b4b" stroke="#d946ef" stroke-width="1.2" />
      <text x="0" y="4" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="#f0abfc" text-anchor="middle">🛒 Shopping Cart</text>
    </g>
    
    <!-- Pill 2 -->
    <g transform="translate(-85, 0)">
      <rect x="-70" y="-15" width="140" height="30" rx="15" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1.2" />
      <text x="0" y="4" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="#38bdf8" text-anchor="middle">📦 Order Tracking</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(85, 0)">
      <rect x="-70" y="-15" width="140" height="30" rx="15" fill="#1e1b4b" stroke="#10b981" stroke-width="1.2" />
      <text x="0" y="4" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="#34d399" text-anchor="middle">💳 Fast Checkout</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(255, 0)">
      <rect x="-70" y="-15" width="140" height="30" rx="15" fill="#1e1b4b" stroke="#f59e0b" stroke-width="1.2" />
      <text x="0" y="4" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="#fbbf24" text-anchor="middle">⚡ Microservices</text>
    </g>
  </g>
</svg>