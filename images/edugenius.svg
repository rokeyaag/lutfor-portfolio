<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="80%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Amber Glow Gradient -->
    <radialGradient id="amberGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#e11d48" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Purple Accent Glow -->
    <radialGradient id="purpleGlow" cx="80%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Golden Cap Gradient -->
    <linearGradient id="goldCapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Crimson Badge Gradient -->
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <!-- Title Gold Gradient -->
    <linearGradient id="titleGoldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#fef08a" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Card Shadow -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    
    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Cosmic Background -->
  <rect width="800" height="480" fill="url(#bgGrad)" />
  <rect width="800" height="480" fill="url(#amberGlow)" />
  <rect width="800" height="480" fill="url(#purpleGlow)" />

  <!-- Subtle Futuristic Grid Lines -->
  <g stroke="#334155" stroke-width="1" stroke-opacity="0.25">
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="160" y1="0" x2="160" y2="480" />
    <line x1="320" y1="0" x2="320" y2="480" />
    <line x1="480" y1="0" x2="480" y2="480" />
    <line x1="640" y1="0" x2="640" y2="480" />
  </g>

  <!-- Central Glassmorphic App Badge Container -->
  <g transform="translate(400, 175)" filter="url(#cardShadow)">
    <!-- Outer Glow Ring -->
    <circle cx="0" cy="0" r="95" fill="none" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="8, 6" />
    
    <!-- Squircle Icon Box -->
    <rect x="-70" y="-70" width="140" height="140" rx="36" fill="url(#bgGrad)" stroke="#f59e0b" stroke-width="3" stroke-opacity="0.9" />
    <rect x="-68" y="-68" width="136" height="136" rx="34" fill="#1e1b4b" fill-opacity="0.6" />

    <!-- Radiant Yellow & Crimson Graduation Cap Logo -->
    <g transform="translate(0, 5) scale(0.95)" filter="url(#glowFilter)">
      <!-- Cap Diamond -->
      <path d="M 0 -38 L 56 -12 L 0 14 L -56 -12 Z" fill="url(#crimsonGrad)" stroke="#ffffff" stroke-width="2" />
      
      <!-- Cap Base -->
      <path d="M -34 2 L -34 22 C -34 40 34 40 34 22 L 34 2 C 26 10 -26 10 -34 2 Z" fill="#7f1d1d" stroke="#ffffff" stroke-width="1.5" />

      <!-- Center Gold Button -->
      <circle cx="0" cy="-12" r="4.5" fill="url(#goldCapGrad)" stroke="#ffffff" stroke-width="1" />

      <!-- Gold Tassel -->
      <path d="M 0 -12 C 32 -6 44 8 46 26" fill="none" stroke="#facc15" stroke-width="2.5" stroke-linecap="round" />
      <circle cx="46" cy="27" r="3" fill="#facc15" />

      <!-- Sparkle Star -->
      <path d="M 0 -26 Q 0 -18 6 -18 Q 0 -18 0 -10 Q 0 -18 -6 -18 Q 0 -18 0 -26 Z" fill="url(#goldCapGrad)" />
    </g>
  </g>

  <!-- Top Badge: NCTB CURRICULUM -->
  <g transform="translate(400, 48)">
    <rect x="-140" y="-15" width="280" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.7" />
    <text x="0" y="5" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="11" fill="#38bdf8" letter-spacing="2.5" text-anchor="middle">🎓 NCTB CLASS 9-10 CURRICULUM</text>
  </g>

  <!-- Brand Title -->
  <g transform="translate(400, 310)">
    <text x="0" y="0" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="url(#titleGoldGrad)" letter-spacing="4" text-anchor="middle" filter="url(#glowFilter)">EDUGENIUS AI</text>
  </g>

  <!-- Subtitle Tagline -->
  <g transform="translate(400, 345)">
    <text x="0" y="0" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="600" font-size="14" fill="#94a3b8" letter-spacing="1" text-anchor="middle">AI-Powered Socratic Tutor &amp; Smart Exam Companion</text>
  </g>

  <!-- 4 Feature Pills on Bottom -->
  <g transform="translate(400, 410)">
    <!-- Pill 1 -->
    <g transform="translate(-255, 0)">
      <rect x="-70" y="-15" width="140" height="30" rx="15" fill="#0f172a" stroke="#a855f7" stroke-width="1.2" />
      <text x="0" y="4" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="#c084fc" text-anchor="middle">🤖 Socratic AI</text>
    </g>
    
    <!-- Pill 2 -->
    <g transform="translate(-85, 0)">
      <rect x="-70" y="-15" width="140" height="30" rx="15" fill="#0f172a" stroke="#10b981" stroke-width="1.2" />
      <text x="0" y="4" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="#34d399" text-anchor="middle">✍️ CQ Evaluator</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(85, 0)">
      <rect x="-70" y="-15" width="140" height="30" rx="15" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2" />
      <text x="0" y="4" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="#fbbf24" text-anchor="middle">🏆 Quiz Arena</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(255, 0)">
      <rect x="-70" y="-15" width="140" height="30" rx="15" fill="#0f172a" stroke="#ef4444" stroke-width="1.2" />
      <text x="0" y="4" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="#f87171" text-anchor="middle">🎙️ Audio Podcast</text>
    </g>
  </g>
</svg>