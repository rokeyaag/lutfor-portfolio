<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="40%" stop-color="#0b1329" />
      <stop offset="80%" stop-color="#14113c" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Accents -->
    <radialGradient id="cyanGlow" cx="50%" cy="38%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.32" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0b1329" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="greenGlow" cx="80%" cy="75%" r="40%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#0b1329" stop-opacity="0" />
    </radialGradient>

    <!-- Shield & Padlock Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="goldKey" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="neonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bgGrad)" />

  <!-- Cyber Grid Pattern -->
  <g stroke="#334155" stroke-opacity="0.15" stroke-width="1">
    <line x1="0" y1="60" x2="800" y2="60" />
    <line x1="0" y1="120" x2="800" y2="120" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="0" y1="420" x2="800" y2="420" />
    <line x1="100" y1="0" x2="100" y2="480" />
    <line x1="200" y1="0" x2="200" y2="480" />
    <line x1="300" y1="0" x2="300" y2="480" />
    <line x1="400" y1="0" x2="400" y2="480" />
    <line x1="500" y1="0" x2="500" y2="480" />
    <line x1="600" y1="0" x2="600" y2="480" />
    <line x1="700" y1="0" x2="700" y2="480" />
  </g>

  <!-- Ambient Glow Circles -->
  <circle cx="400" cy="180" r="280" fill="url(#cyanGlow)" />
  <circle cx="680" cy="380" r="200" fill="url(#greenGlow)" />

  <!-- Central Security Shield Emblem -->
  <g transform="translate(400, 160)" filter="url(#softGlow)">
    <!-- Outer Shield Halo -->
    <path d="M 0 -85 Q 75 -85 85 -35 Q 95 35 0 95 Q -95 35 -85 -35 Q -75 -85 0 -85 Z" 
          fill="none" stroke="#06b6d4" stroke-width="2.5" stroke-opacity="0.5" stroke-dasharray="8 5" />

    <!-- Shield Body -->
    <path d="M 0 -75 Q 65 -75 75 -30 Q 80 30 0 85 Q -80 30 -75 -30 Q -65 -75 0 -75 Z" 
          fill="url(#shieldGrad)" stroke="url(#neonCyan)" stroke-width="3" filter="url(#neonShadow)" />

    <!-- Padlock Shackle -->
    <path d="M -24 -15 A 24 24 0 0 1 24 -15 V 5 H 12 V -15 A 12 12 0 0 0 -12 -15 V 5 H -24 Z" 
          fill="url(#neonCyan)" />

    <!-- Padlock Body -->
    <rect x="-35" y="0" width="70" height="52" rx="10" fill="#0f172a" stroke="url(#neonCyan)" stroke-width="2.5" />

    <!-- Padlock Keyhole -->
    <circle cx="0" cy="20" r="6.5" fill="url(#goldKey)" />
    <path d="M -3.5 22 L 3.5 22 L 5 36 L -5 36 Z" fill="url(#goldKey)" />
    <circle cx="0" cy="20" r="2" fill="#020617" />
  </g>

  <!-- Cyber Node Connections -->
  <g stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4">
    <line x1="200" y1="160" x2="310" y2="160" stroke-dasharray="4 4" />
    <circle cx="200" cy="160" r="4" fill="#06b6d4" />
    <circle cx="200" cy="160" r="8" fill="none" stroke="#06b6d4" stroke-opacity="0.6" />

    <line x1="490" y1="160" x2="600" y2="160" stroke-dasharray="4 4" />
    <circle cx="600" cy="160" r="4" fill="#10b981" />
    <circle cx="600" cy="160" r="8" fill="none" stroke="#10b981" stroke-opacity="0.6" />

    <!-- Floating Hexagons -->
    <polygon points="170,100 185,92 200,100 200,118 185,126 170,118" fill="none" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.5" />
    <polygon points="620,100 635,92 650,100 650,118 635,126 620,118" fill="none" stroke="#10b981" stroke-opacity="0.35" stroke-width="1.5" />
  </g>

  <!-- Project Name & Title -->
  <text x="400" y="300" text-anchor="middle" font-family="'Segoe UI', 'Inter', system-ui, sans-serif" font-size="34" font-weight="900" letter-spacing="4" fill="url(#textGrad)" filter="url(#neonShadow)">
    SECURELOCK
  </text>

  <!-- Subtitle -->
  <text x="400" y="335" text-anchor="middle" font-family="'Segoe UI', 'Inter', system-ui, sans-serif" font-size="14.5" font-weight="500" letter-spacing="1.5" fill="#94a3b8">
    MILITARY-GRADE AES-256 WINDOWS FOLDER LOCKER &amp; VAULT
  </text>

  <!-- Badge Pills Container -->
  <g transform="translate(400, 395)">
    <!-- Badge 1: AES-256-GCM -->
    <g transform="translate(-230, 0)">
      <rect x="-65" y="-16" width="130" height="32" rx="16" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5" />
      <text x="0" y="5" text-anchor="middle" font-family="'Segoe UI', 'Inter', sans-serif" font-size="11.5" font-weight="700" fill="#38bdf8">
        🛡️ AES-256-GCM
      </text>
    </g>

    <!-- Badge 2: Email OTP Recovery -->
    <g transform="translate(-75, 0)">
      <rect x="-75" y="-16" width="150" height="32" rx="16" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
      <text x="0" y="5" text-anchor="middle" font-family="'Segoe UI', 'Inter', sans-serif" font-size="11.5" font-weight="700" fill="#34d399">
        📧 Email OTP Reset
      </text>
    </g>

    <!-- Badge 3: Dual-Slot Wrapping -->
    <g transform="translate(95, 0)">
      <rect x="-80" y="-16" width="160" height="32" rx="16" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" />
      <text x="0" y="5" text-anchor="middle" font-family="'Segoe UI', 'Inter', sans-serif" font-size="11.5" font-weight="700" fill="#c084fc">
        🔑 Key Envelope Cipher
      </text>
    </g>

    <!-- Badge 4: Desktop App -->
    <g transform="translate(245, 0)">
      <rect x="-55" y="-16" width="110" height="32" rx="16" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
      <text x="0" y="5" text-anchor="middle" font-family="'Segoe UI', 'Inter', sans-serif" font-size="11.5" font-weight="700" fill="#fbbf24">
        💻 Windows App
      </text>
    </g>
  </g>
</svg>
